<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Background circle -->
<circle cx="100" cy="100" r="100" fill="#F8F9FA"/>
<circle cx="100" cy="100" r="70" fill="#E9ECEF"/>

<!-- Delivery box with red theme -->
<rect x="70" y="75" width="60" height="50" rx="8" fill="#E84144" fill-opacity="0.1"/>
<rect x="70" y="75" width="60" height="50" rx="8" stroke="#E84144" stroke-width="2" fill="none"/>

<!-- Box lines -->
<line x1="70" y1="90" x2="130" y2="90" stroke="#E84144" stroke-width="1" stroke-opacity="0.3"/>
<line x1="100" y1="75" x2="100" y2="125" stroke="#E84144" stroke-width="1" stroke-opacity="0.3"/>

<!-- Search icon overlay -->
<circle cx="115" cy="60" r="12" fill="#6C757D" fill-opacity="0.2"/>
<circle cx="115" cy="60" r="8" fill="none" stroke="#6C757D" stroke-width="2"/>
<line x1="121" y1="66" x2="125" y2="70" stroke="#6C757D" stroke-width="2" stroke-linecap="round"/>

<!-- Status indicator -->
<circle cx="85" cy="145" r="4" fill="#34C759"/>
<text x="95" y="150" font-family="system-ui" font-size="12" fill="#6C757D">Ready to deliver</text>
</svg> 